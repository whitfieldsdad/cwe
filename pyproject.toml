[tool.poetry]
name = "cwe"
version = "1.0.1"
description = "MITRE Common Weakness Enumeration (CWE)"
authors = ["Tyler Fisher <tylerfisher@tylerfisher.ca>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
dacite = "^1.8.1"
click = "^8.1.8"
polars = "^2.1.0"

[tool.poetry.scripts]
tool = "cwe.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
