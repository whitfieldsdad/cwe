[tool.poetry]
name = "cwe"
version = "1.0.1"
description = "MITRE Common Weakness Enumeration (CWE)"
authors = ["Tyler Fisher <tylerfisher@tylerfisher.ca>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
xmltodict = "^0.13.0"
dacite = "^1.8.1"
click = "^8.1.8"

[tool.poetry.scripts]
tool = "cwe.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
